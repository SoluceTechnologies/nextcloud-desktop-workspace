name: Build release installers

on:
  workflow_call:
    inputs:
      version:
        description: "Version being released (e.g. 1.3.0)"
        required: true
        type: string
      ref:
        description: "Release identifier (draft tag) to upload assets to"
        required: true
        type: string

permissions:
  contents: write

env:
  APP: nextcloud-workspace

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file

      - run: npm ci

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          NAME="$APP-${{ inputs.version }}-${{ matrix.target }}"
          mkdir -p dist
          for f in "$BUNDLE"/dmg/*.dmg "$BUNDLE"/nsis/*.exe "$BUNDLE"/msi/*.msi \
                   "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm "$BUNDLE"/appimage/*.AppImage; do
            cp "$f" "dist/$NAME.${f##*.}"
          done
          cd dist
          for f in *; do shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"; done
          ls -l

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.ref }}" dist/* --clobber
