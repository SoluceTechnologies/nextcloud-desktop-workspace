[package]
name = "nc-workspaces"
version = "0.5.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "nc_workspaces_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
ureq = { version = "3", features = ["json", "platform-verifier"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSURL", "NSURLRequest"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
glib = "0.18"
gtk = "0.18"

[dev-dependencies]
tempfile = "3"

# Linux only: upstream child-webview positioning is broken on GTK (webviews get
# packed into a vbox and stack instead of overlaying at their set position/size).
# See https://github.com/tauri-apps/tauri/issues/10420 and
# https://github.com/tauri-apps/tauri/issues/16132. Vendored 2.11.4 with child
# webviews mounted in a gtk::Layout and positioned via move_/set_size_request
# (see place_in_layout in vendor/tauri-runtime-wry/src/lib.rs). Linux/BSD only;
# other platforms compile the stock code paths. Remove once fixed upstream.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
